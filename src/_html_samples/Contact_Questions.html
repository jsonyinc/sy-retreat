<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사업 제휴 및 문의 | SUNYEOP ZEN RETREAT</title>
    
    <!-- 구글 폰트: 우아한 명조체(Noto Serif KR)와 깔끔한 고딕체(Noto Sans KR) 로드 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind 폰트 설정 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                        serif: ['"Noto Serif KR"', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* 브라우저 기본 자동완성(Autofill) 배경색을 딥 올리브 그린으로 덮어쓰기 위한 커스텀 CSS */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active,
        textarea:-webkit-autofill,
        textarea:-webkit-autofill:hover,
        textarea:-webkit-autofill:focus,
        textarea:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #2C3E1A inset !important;
            -webkit-text-fill-color: #F9F6F0 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
        
        /* 텍스트 에어리어 스크롤바 커스텀 */
        textarea::-webkit-scrollbar {
            width: 6px;
        }
        textarea::-webkit-scrollbar-thumb {
            background-color: #8FBC8F;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-[#F9F6F0] font-sans antialiased">

    <div class="min-h-screen flex flex-col justify-end">
        
        <!-- Business Inquiry Form Section 시작 -->
        <section class="bg-[#2C3E1A] text-[#F9F6F0] py-24 px-6 md:px-12">
            <div class="max-w-4xl mx-auto">
                
                <!-- 헤더 영역 -->
                <div class="text-center mb-16">
                    <h2 class="text-xs md:text-sm tracking-[0.3em] text-[#C5A880] uppercase mb-4">
                        Business Inquiry
                    </h2>
                    <h3 class="text-3xl md:text-5xl font-serif mb-6 font-light tracking-wide">
                        사업 제휴 및 문의
                    </h3>
                    <p class="text-[#8FBC8F] font-light text-sm md:text-base">
                        선엽 리트릿과 함께 동양 자연치유 웰니스의 새로운 비전을 만들어갈 파트너를 모십니다.
                    </p>
                </div>
                
                <!-- 폼 영역 -->
                <form class="space-y-10" onsubmit="event.preventDefault(); alert('문의가 성공적으로 접수되었습니다. 담당자가 확인 후 연락드리겠습니다.');">
                    
                    <!-- 2단 그리드 (데스크탑에서는 나란히, 모바일에서는 위아래로) -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                        <!-- 소속 기업/기관명 -->
                        <div class="relative group">
                            <label for="company" class="block text-xs uppercase tracking-widest text-[#8FBC8F] mb-2 transition-colors group-focus-within:text-[#C5A880]">
                                소속 기업 / 기관명
                            </label>
                            <input 
                                type="text" 
                                id="company" 
                                name="company"
                                class="w-full bg-transparent border-b border-[#8FBC8F]/40 py-3 text-[#F9F6F0] text-lg focus:outline-none focus:border-[#C5A880] transition-colors placeholder:text-[#8FBC8F]/30 placeholder:text-sm"
                                placeholder="기업명 또는 기관명을 입력해 주세요"
                                required
                            />
                        </div>

                        <!-- 담당자 성함 -->
                        <div class="relative group">
                            <label for="name" class="block text-xs uppercase tracking-widest text-[#8FBC8F] mb-2 transition-colors group-focus-within:text-[#C5A880]">
                                담당자 성함
                            </label>
                            <input 
                                type="text" 
                                id="name" 
                                name="name"
                                class="w-full bg-transparent border-b border-[#8FBC8F]/40 py-3 text-[#F9F6F0] text-lg focus:outline-none focus:border-[#C5A880] transition-colors placeholder:text-[#8FBC8F]/30 placeholder:text-sm"
                                placeholder="성함을 입력해 주세요"
                                required
                            />
                        </div>
                    </div>
                    
                    <!-- 연락처 또는 이메일 -->
                    <div class="relative group">
                        <label for="contact" class="block text-xs uppercase tracking-widest text-[#8FBC8F] mb-2 transition-colors group-focus-within:text-[#C5A880]">
                            회신받으실 연락처 또는 이메일
                        </label>
                        <input 
                            type="text" 
                            id="contact" 
                            name="contact"
                            class="w-full bg-transparent border-b border-[#8FBC8F]/40 py-3 text-[#F9F6F0] text-lg focus:outline-none focus:border-[#C5A880] transition-colors placeholder:text-[#8FBC8F]/30 placeholder:text-sm"
                            placeholder="이메일 주소 또는 전화번호를 입력해 주세요"
                            required
                        />
                    </div>
                    
                    <!-- 문의 유형 선택 -->
                    <div class="relative group">
                        <label for="inquiry_type" class="block text-xs uppercase tracking-widest text-[#8FBC8F] mb-2 transition-colors group-focus-within:text-[#C5A880]">
                            문의 유형
                        </label>
                        <select 
                            id="inquiry_type" 
                            name="inquiry_type"
                            class="w-full bg-transparent border-b border-[#8FBC8F]/40 py-3 text-[#F9F6F0] text-lg focus:outline-none focus:border-[#C5A880] transition-colors appearance-none cursor-pointer"
                            required
                        >
                            <option value="" class="bg-[#2C3E1A] text-[#8FBC8F]">문의하실 분야를 선택해 주세요</option>
                            <option value="partnership" class="bg-[#2C3E1A]">마스터 프랜차이즈 및 공간 제휴 (Partnership)</option>
                            <option value="investment" class="bg-[#2C3E1A]">자본 투자 및 조인트 벤처 (Investment)</option>
                            <option value="program" class="bg-[#2C3E1A]">웰니스 프로그램 및 약차 도입 (B2B Supply)</option>
                            <option value="other" class="bg-[#2C3E1A]">기타 문의 (Others)</option>
                        </select>
                        <!-- 커스텀 드롭다운 화살표 -->
                        <div class="absolute right-0 bottom-4 pointer-events-none text-[#C5A880]">
                            <svg class="w-5 h-5 fill-current" viewBox="0 0 20 20">
                                <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
                            </svg>
                        </div>
                    </div>

                    <!-- 상세 문의 내용 -->
                    <div class="relative group">
                        <label for="message" class="block text-xs uppercase tracking-widest text-[#8FBC8F] mb-2 transition-colors group-focus-within:text-[#C5A880]">
                            상세 문의 내용
                        </label>
                        <textarea 
                            id="message" 
                            name="message"
                            rows="4"
                            class="w-full bg-transparent border-b border-[#8FBC8F]/40 py-3 text-[#F9F6F0] text-lg focus:outline-none focus:border-[#C5A880] transition-colors placeholder:text-[#8FBC8F]/30 placeholder:text-sm resize-none"
                            placeholder="제안하시고자 하는 내용이나 궁금하신 점을 상세히 적어주세요."
                            required
                        ></textarea>
                    </div>
                    
                    <!-- 제출 버튼 -->
                    <div class="pt-8 text-center">
                        <button 
                            type="submit" 
                            class="inline-block bg-[#C5A880] text-[#2C3E1A] px-14 py-5 text-sm tracking-[0.2em] font-medium uppercase hover:bg-[#F9F6F0] transition-colors duration-300 w-full md:w-auto"
                        >
                            문의 접수하기
                        </button>
                        <p class="mt-6 text-xs text-[#8FBC8F]/60 font-light tracking-wide">
                            제출하신 비즈니스 정보는 기밀로 유지되며, 영업일 기준 48시간 이내에 회신해 드립니다.
                        </p>
                    </div>
                </form>
            </div>
        </section>
        <!-- Business Inquiry Form Section 끝 -->

    </div>
</body>
</html>
